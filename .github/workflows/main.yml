name: Build Android Webview APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Force Build Web Assets
        run: |
          mkdir -p dist
          if [ -d "public" ]; then
            cp -r public/* dist/
          fi
          if [ -d "src" ]; then
            cp -r src/* dist/
          fi
          if [ -f "index.html" ]; then
            cp index.html dist/
          fi
          if [ ! -f "dist/index.html" ]; then
            echo '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vircadia World</title></head><body><h2 style="text-align:center;margin-top:50px;">Vircadia World Loading...</h2></body></html>' > dist/index.html
          fi

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Bouncy Castle & Build Android APK
        run: |
          npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/android@5
          npx cap init "VircadiaWorld" "com.vircadia.app" --web-dir "dist"
          npx cap add android
          npx cap copy android
          cd android
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dorg.gradle.internal.repository.max.tenants=3" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --refresh-dependencies

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vircadia-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
