name: Build Android Webview APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build --if-present

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets & Build APK
        run: |
          # যদি কোনো বিল্ড ডিরেক্টরি না থাকে, তবে একটি বানিয়ে নেওয়া
          WEB_DIR="www"
          mkdir -p $WEB_DIR

          if [ -f "dist/index.html" ]; then
            WEB_DIR="dist"
          elif [ -f "build/index.html" ]; then
            WEB_DIR="build"
          elif [ -f "public/index.html" ]; then
            WEB_DIR="public"
          elif [ -f "index.html" ]; then
            cp index.html $WEB_DIR/
          else
            echo "<!DOCTYPE html><html><head><title>Vircadia World</title></head><body><h1>Welcome to Vircadia Metaverse</h1></body></html>" > $WEB_DIR/index.html
          fi

          echo "Using Web Directory: $WEB_DIR"

          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap init "VircadiaWorld" "com.vircadia.app" --web-dir "$WEB_DIR"
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vircadia-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
