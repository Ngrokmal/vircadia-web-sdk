name: Build Android Webview APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Setup Web Assets with Vircadia 3D Web World
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
              <title>Vircadia 3D World</title>
              <style>
                  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
                  iframe { width: 100%; height: 100%; border: none; }
              </style>
          </head>
          <body>
              <iframe src="https://vircadia.github.io/vircadia-web-sdk/" allow="camera; microphone; display-capture; autoplay; encrypted-media; geolocation; accelerometer; gyroscope;"></iframe>
          </body>
          </html>
          EOF

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/android@5
          npx cap init "VircadiaWorld" "com.vircadia.app" --web-dir "dist"
          npx cap add android
          npx cap copy android
          cd android
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vircadia-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
