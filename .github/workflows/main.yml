name: Build Vircadia 3D App APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch Official Vircadia Web World Client
        run: |
          mkdir -p dist
          # Vircadia-র অফিসিয়াল ৩ডি ওয়েব অ্যাপ ক্লায়েন্ট সোর্স ডাউনলোড
          curl -sL https://github.com/vircadia/vircadia-web-client/archive/refs/heads/master.tar.gz | tar -xz --strip-components=1 -C dist || true
          
          # ফাইল খালি থাকলে ব্যাকআপ মেটাভার্স ৩ডি ইন্টারফেস তৈরি
          if [ ! -f "dist/index.html" ]; then
            cat << 'EOF' > dist/index.html
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
                <title>Vircadia World</title>
                <style>
                    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: sans-serif; }
                    #viewport { width: 100%; height: 100%; border: none; }
                </style>
            </head>
            <body>
                <iframe id="viewport" src="https://metaverse.vircadia.com/" allow="camera; microphone; display-capture; autoplay; accelerometer; gyroscope;"></iframe>
            </body>
            </html>
            EOF
          fi

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/android@5
          npx cap init "VircadiaWorld" "com.vircadia.app" --web-dir "dist"
          npx cap add android
          npx cap copy android
          cd android
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vircadia-3D-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
